name: revpilot
version: '1.0'
config-version: 2
profile: revpilot
model-paths: [models]
macro-paths: [macros]
models:
  revpilot:
    +materialized: view
    +schema: mart
    +post-hook:
      - 'ALTER VIEW {{ this }} SET (security_invoker = true)'
      - 'GRANT SELECT ON {{ this }} TO revpilot_app'
