[project]
name = "revpilot-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.4",
    "statsmodels>=0.15.0",
    "temporalio>=1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ['tests']
